<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Account Manager</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#C9A84C;
  --gold-light:#E8C96B;
  --dark:#0D1117;
  --card-bg:#1C2128;
  --text:#E6EDF3;
  --muted:#8B949E;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:var(--dark);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  padding:30px;
}

.toolbar{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:30px;
}

button,select{
  padding:10px 16px;
  border-radius:8px;
  border:none;
  font-size:14px;
}

button{
  cursor:pointer;
}

.btn{
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
}

.cards-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.account-card{
  background:var(--card-bg);
  border-radius:14px;
  padding:20px;
}

.field{
  margin-top:10px;
}

.field small{
  color:var(--muted);
}

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:100;
}

.modal-overlay.open{
  display:flex;
}

.modal{
  width:min(95%,1000px);
  background:#111;
  padding:20px;
  border-radius:14px;
}

.preview-wrap{
  overflow:auto;
}

#downloadCanvas{
  position:fixed;
  left:-9999px;
  top:0;
  width:1500px;
}
</style>
</head>
<body>

<div class="toolbar">

<button class="btn" onclick="openPreview()">
Preview
</button>

<button class="btn" onclick="downloadImage()">
Download
</button>

<select id="fontSizeSelect" onchange="updateExportSettings()">
<option value="12">Small</option>
<option value="14" selected>Medium</option>
<option value="16">Large</option>
<option value="18">XL</option>
</select>

<select id="spacingSelect" onchange="updateExportSettings()">
<option value="0">Normal</option>
<option value="1">Wide</option>
<option value="2">Extra Wide</option>
</select>

<select id="bgSelect" onchange="updateExportSettings()">
<option value="navy">Navy</option>
<option value="black">Black</option>
<option value="green">Green</option>
<option value="gold">Gold</option>
<option value="purple">Purple</option>
</select>

</div>


<div class="cards-grid" id="cardsGrid"></div>


<div class="modal-overlay" id="previewModal">
  <div class="modal">

    <div class="preview-wrap" id="previewWrap"></div>

    <br>

    <button onclick="closePreview()">
      Close
    </button>

  </div>
</div>


<div id="downloadCanvas"></div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>

const BANK_THEMES={
  raast:{bg:"#0D4A4A",emoji:"🔗"},
  jazz:{bg:"#4A0E6B",emoji:"📱"},
  meezan:{bg:"#1B3A1F",emoji:"🏦"}
};

const EXPORT_BACKGROUNDS={
  navy:"linear-gradient(145deg,#0A1628 0%,#0D1F3C 50%,#0A1628 100%)",
  black:"linear-gradient(145deg,#111 0%,#222 50%,#111 100%)",
  green:"linear-gradient(145deg,#0B2E1C 0%,#144D32 50%,#0B2E1C 100%)",
  gold:"linear-gradient(145deg,#3A2B00 0%,#5C4300 50%,#3A2B00 100%)",
  purple:"linear-gradient(145deg,#240046 0%,#3C096C 50%,#240046 100%)"
};

let exportSettings={
  fontSize:14,
  letterSpacing:0,
  background:"navy"
};

const accounts=[
{
  bank:"Raast",
  type:"raast",
  name:"Mir Aarib Traders",
  number:"03004493015"
},
{
  bank:"JazzCash",
  type:"jazz",
  name:"Muhammad Zakir Hussain",
  number:"03325275150"
},
{
  bank:"Meezan Bank",
  type:"meezan",
  name:"MUHAMMAD ZAKIR HUSSAIN",
  number:"98810103802374"
}
];


function updateExportSettings(){

  exportSettings.fontSize=
  parseInt(
    document.getElementById("fontSizeSelect").value
  );

  exportSettings.letterSpacing=
  parseInt(
    document.getElementById("spacingSelect").value
  );

  exportSettings.background=
  document.getElementById("bgSelect").value;

}


function render(){

  cardsGrid.innerHTML=
  accounts.map(a=>`

    <div class="account-card">

      <h3>
      ${a.bank}
      </h3>

      <div class="field">
        <small>Name</small>
        <div>${a.name}</div>
      </div>

      <div class="field">
        <small>Account</small>
        <div>${a.number}</div>
      </div>

    </div>

  `).join("");

}


function buildDownloadHTML(){

  const bg=
  EXPORT_BACKGROUNDS[
    exportSettings.background
  ];

  return `

  <div
    class="dl-card"
    style="
      background:${bg};
      padding:40px;
      color:white;
      font-family:'DM Sans',sans-serif;
      border-radius:16px;
    "
  >

    <h1
      style="
        margin-bottom:30px;
        font-family:'Playfair Display',serif;
      "
    >
      Payment Details
    </h1>


    <div
      style="
        display:grid;
        grid-template-columns:repeat(3,1fr);
        gap:20px;
      "
    >

      ${accounts.map(a=>{

        const theme=
        BANK_THEMES[a.type];

        return `

        <div
          style="
            background:rgba(255,255,255,.05);
            padding:20px;
            border-radius:14px;
          "
        >

          <div
            style="
              font-size:26px;
              margin-bottom:10px;
            "
          >
            ${theme.emoji}
          </div>

          <h3>
            ${a.bank}
          </h3>

          <br>

          <div>
            ${a.name}
          </div>

          <br>

          <div
            style="
              font-size:${exportSettings.fontSize}px;
              letter-spacing:${exportSettings.letterSpacing}px;
              font-family:'DM Mono',monospace;
            "
          >
            ${a.number}
          </div>

        </div>

        `;

      }).join("")}

    </div>

  </div>

  `;

}


function openPreview(){

  previewWrap.innerHTML=
  buildDownloadHTML();

  previewModal.classList.add("open");

}


function closePreview(){

  previewModal.classList.remove("open");

}


async function downloadImage(){

  const canvas=
  document.getElementById(
    "downloadCanvas"
  );

  canvas.innerHTML=
  buildDownloadHTML();

  await document.fonts.ready;

  const element=
  canvas.querySelector(
    ".dl-card"
  );

  const image=
  await html2canvas(
    element,
    {
      scale:2,
      backgroundColor:null
    }
  );

  const link=
  document.createElement("a");

  link.download=
  "payment-details.jpg";

  link.href=
  image.toDataURL(
    "image/jpeg",
    .95
  );

  link.click();

}

render();

</script>

</body>
</html>
