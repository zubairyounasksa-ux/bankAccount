<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Account Details</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Required for Download Image -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
        integrity="sha512-BNa5hT+ZUpT6gibR9WvKp9xO7+q3MYo1uT4f6gM+ap1Cq4X1Q+3x4A8X0JHef0mxFwlG7VY7Q3u/QZQ3qZ0hfw=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>

<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #E8C96B;
    --gold-pale: #F5E9C8;
    --dark: #0D1117;
    --dark-2: #161B22;
    --dark-3: #21262D;
    --card-bg: #1C2128;
    --border: rgba(201,168,76,0.25);
    --text: #E6EDF3;
    --text-muted: #8B949E;
    --green: #1A6B4A;
    --green-light: #2EA669;
    --radius: 16px;

    /* Download controls */
    --download-bg: linear-gradient(145deg, #0A1628 0%, #0D1F3C 50%, #0A1628 100%);
    --download-bg-solid: #0A1628;
    --dl-font-size: 100%;
    --dl-letter-spacing: 0px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 32px 16px 60px;
  }

  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .header-badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
    color: #000;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    padding: 6px 20px;
    border-radius: 100px;
    margin-bottom: 14px;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 700;
    background: linear-gradient(135deg, var(--gold-light), #fff 50%, var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.15;
  }
  .header p {
    color: var(--text-muted);
    margin-top: 10px;
    font-size: 14px;
  }

  .toolbar {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 22px;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all .2s;
    white-space: nowrap;
  }
  .btn-gold {
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: #000;
  }
  .btn-gold:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-outline {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--gold);
  }
  .btn-outline:hover { background: rgba(201,168,76,.08); transform: translateY(-1px); }
  .btn-green {
    background: linear-gradient(135deg, var(--green), var(--green-light));
    color: #fff;
  }
  .btn-green:hover { filter: brightness(1.1); transform: translateY(-1px); }

  .control-panel {
    max-width: 1100px;
    margin: 0 auto 36px;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(4, minmax(180px, 1fr));
    gap: 14px;
    background: rgba(255,255,255,.025);
    border: 1px solid rgba(201,168,76,.18);
    border-radius: 16px;
  }
  .control-group label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    color: var(--gold);
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-bottom: 7px;
    font-weight: 600;
  }
  .control-value {
    color: var(--text-muted);
    font-size: 10px;
    letter-spacing: 0;
    text-transform: none;
  }
  .control-group input[type="range"],
  .control-group select,
  .control-group input[type="color"] {
    width: 100%;
  }
  .control-group select {
    background: var(--dark-3);
    border: 1.5px solid rgba(255,255,255,.1);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
  }
  .control-group select option { background: var(--dark-2); }
  .control-group input[type="color"] {
    height: 39px;
    background: var(--dark-3);
    border: 1.5px solid rgba(255,255,255,.1);
    border-radius: 10px;
    padding: 4px;
    cursor: pointer;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    max-width: 1100px;
    margin: 0 auto 40px;
  }

  .account-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    position: relative;
    overflow: hidden;
    transition: transform .2s, box-shadow .2s;
  }
  .account-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
  }
  .account-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(0,0,0,.4);
  }

  .card-bank-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .bank-icon {
    width: 42px; height: 42px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .bank-name {
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
  }
  .bank-type {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .card-field { margin-bottom: 14px; }
  .field-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 4px;
    font-weight: 500;
  }
  .field-value {
    font-family: 'DM Mono', monospace;
    font-size: 13.5px;
    color: var(--text);
    word-break: break-all;
    line-height: 1.5;
  }
  .field-value.large {
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 600;
    font-variant-numeric: normal;
    letter-spacing: normal;
  }

  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,.06);
  }
  .card-btn {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    transition: all .2s;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .card-btn:hover { background: rgba(255,255,255,.05); color: var(--text); }
  .card-btn.danger:hover { border-color: #f85149; color: #f85149; background: rgba(248,81,73,.05); }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 16px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--dark-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    width: 100%; max-width: 480px;
    max-height: 92vh;
    overflow: auto;
    transform: translateY(20px);
    transition: transform .25s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal h2 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    margin-bottom: 24px;
    color: var(--gold-light);
  }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-group input, .form-group select {
    width: 100%;
    background: var(--dark-3);
    border: 1.5px solid rgba(255,255,255,.1);
    border-radius: 10px;
    padding: 11px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  .form-group input:focus, .form-group select:focus {
    border-color: var(--gold);
  }
  .form-group select option { background: var(--dark-2); }
  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .modal-actions .btn { flex: 1; justify-content: center; }

  #previewModal .modal { max-width: 1180px; }
  .preview-wrap {
    overflow: auto;
    margin-top: 20px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #05080d;
  }
  #previewWrap .dl-card {
    width: 1120px;
    min-height: auto;
    transform-origin: top left;
  }

  #downloadCanvas {
    position: fixed;
    left: -99999px;
    top: 0;
    width: 1200px;
    pointer-events: none;
  }

  .dl-card {
    width: 1200px;
    background: var(--download-bg);
    padding: 50px;
    font-family: 'DM Sans', sans-serif;
    color: #fff;
    position: relative;
    overflow: hidden;
    font-size: var(--dl-font-size);
  }
  .dl-card::before {
    content: '';
    position: absolute;
    top: -100px; right: -100px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,168,76,.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .dl-card::after {
    content: '';
    position: absolute;
    bottom: -80px; left: -80px;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(26,107,74,.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .dl-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 28px;
    border-bottom: 1px solid rgba(201,168,76,.3);
    margin-bottom: 32px;
    position: relative; z-index: 1;
  }
  .dl-title {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 700;
    background: linear-gradient(135deg, #C9A84C, #F5E9C8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .dl-subtitle {
    font-size: 12px;
    letter-spacing: calc(2px + var(--dl-letter-spacing));
    text-transform: uppercase;
    color: rgba(255,255,255,.4);
    margin-top: 4px;
  }
  .dl-logo-mark {
    width: 52px; height: 52px;
    border-radius: 14px;
    background: linear-gradient(135deg, #C9A84C, #E8C96B);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: #000;
  }

  /* FIX: Always exactly 3 cards in one row for preview and export */
  .dl-accounts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    position: relative; z-index: 1;
  }

  .dl-account {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(201,168,76,.2);
    border-radius: 14px;
    padding: 20px 22px;
    position: relative;
    overflow: hidden;
    min-width: 0;
  }
  .dl-account::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, #C9A84C, #E8C96B, #C9A84C);
  }
  .dl-acc-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .dl-bank-icon {
    width: 38px; height: 38px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700;
    flex-shrink: 0;
  }
  .dl-bank-name { font-size: 14px; font-weight: 600; color: #fff; }
  .dl-bank-type {
    font-size: 10px;
    color: rgba(255,255,255,.4);
    letter-spacing: calc(1px + var(--dl-letter-spacing));
    text-transform: uppercase;
  }
  .dl-field { margin-bottom: 10px; }
  .dl-field-label {
    font-size: 9px;
    letter-spacing: calc(1.5px + var(--dl-letter-spacing));
    text-transform: uppercase;
    color: #C9A84C;
    margin-bottom: 2px;
    font-weight: 500;
  }
  .dl-field-value {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: rgba(255,255,255,.85);
    word-break: break-word;
    line-height: 1.45;
    letter-spacing: var(--dl-letter-spacing);
  }
  .dl-field-value.name {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: normal;
  }
  .dl-footer {
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid rgba(201,168,76,.15);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    position: relative; z-index: 1;
  }
  .dl-footer-text {
    font-size: 11px;
    color: rgba(255,255,255,.25);
    letter-spacing: calc(1px + var(--dl-letter-spacing));
  }
  .dl-footer-date { font-size: 11px; color: rgba(255,255,255,.25); }

  .theme-raast  { background: #1E6E6E; color: #fff; }
  .theme-jazz   { background: #7B1FA2; color: #fff; }
  .theme-meezan { background: #1B5E20; color: #fff; }
  .theme-hbl    { background: #B71C1C; color: #fff; }
  .theme-uba    { background: #E65100; color: #fff; }
  .theme-other  { background: #283593; color: #fff; }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    grid-column: 1 / -1;
  }
  .empty svg { opacity: .3; margin-bottom: 16px; }
  .empty p { font-size: 14px; }

  @media (max-width: 800px) {
    .control-panel { grid-template-columns: repeat(2, minmax(160px, 1fr)); }
  }

  @media (max-width: 560px) {
    body { padding: 24px 12px 48px; }
    .toolbar { align-items: stretch; }
    .btn { width: 100%; }
    .control-panel { grid-template-columns: 1fr; }
    .cards-grid { grid-template-columns: 1fr; }
    .modal { padding: 24px; }
    .modal-actions { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-badge">💳 Payment Details</div>
  <h1>Bank Account Manager</h1>
  <p>Manage, preview & share your payment details beautifully</p>
</div>

<div class="toolbar">
  <button class="btn btn-gold" onclick="openAddModal()">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Add Account
  </button>
  <button class="btn btn-outline" onclick="openPreview()">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    Preview
  </button>
  <button class="btn btn-green" onclick="downloadImage()">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Download Image
  </button>
</div>

<div class="control-panel">
  <div class="control-group">
    <label>Font Size <span class="control-value" id="fontSizeLabel">100%</span></label>
    <input type="range" id="fontSizeControl" min="85" max="125" value="100" step="1">
  </div>

  <div class="control-group">
    <label>Letter Spacing <span class="control-value" id="letterSpacingLabel">0.0px</span></label>
    <input type="range" id="letterSpacingControl" min="-0.5" max="2.5" value="0" step="0.1">
  </div>

  <div class="control-group">
    <label>Download Background</label>
    <select id="downloadBgSelect">
      <option value="navy">Premium Navy</option>
      <option value="black">Luxury Black</option>
      <option value="emerald">Emerald</option>
      <option value="maroon">Maroon</option>
      <option value="white">Clean White</option>
      <option value="custom">Custom Color</option>
    </select>
  </div>

  <div class="control-group">
    <label>Custom Color</label>
    <input type="color" id="customBgColor" value="#0A1628">
  </div>
</div>

<div class="cards-grid" id="cardsGrid"></div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2 id="modalTitle">Add New Account</h2>
    <div class="form-group">
      <label>Bank / Service Name</label>
      <input type="text" id="f_bank" placeholder="e.g. Meezan Bank, JazzCash…">
    </div>
    <div class="form-group">
      <label>Account Type</label>
      <select id="f_type">
        <option value="raast">Raast ID</option>
        <option value="jazz">JazzCash / Mobile Wallet</option>
        <option value="meezan">Islamic Bank</option>
        <option value="hbl">Commercial Bank</option>
        <option value="uba">Digital Bank</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Account Holder Name</label>
      <input type="text" id="f_name" placeholder="Full name">
    </div>
    <div class="form-group">
      <label>Account / ID Number</label>
      <input type="text" id="f_number" placeholder="Account or phone number">
    </div>
    <div class="form-group">
      <label>IBAN (optional)</label>
      <input type="text" id="f_iban" placeholder="PK00XXXX0000000000000000">
    </div>
    <div class="form-group">
      <label>Branch (optional)</label>
      <input type="text" id="f_branch" placeholder="Branch name">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('addModal')">Cancel</button>
      <button class="btn btn-gold" onclick="saveAccount()">Save Account</button>
    </div>
  </div>
</div>

<!-- Preview Modal -->
<div class="modal-overlay" id="previewModal">
  <div class="modal">
    <h2>Preview — Download Card</h2>
    <div class="preview-wrap" id="previewWrap"></div>
    <div class="modal-actions" style="margin-top:16px;">
      <button class="btn btn-outline" onclick="closeModal('previewModal')">Close</button>
      <button class="btn btn-green" onclick="downloadImage()">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download
      </button>
    </div>
  </div>
</div>

<!-- Hidden download canvas -->
<div id="downloadCanvas"></div>

<script>
const BANK_THEMES = {
  raast:     { bg:'#0D4A4A', text:'#4ECDC4', emoji:'🔗', label:'Raast' },
  jazz:      { bg:'#4A0E6B', text:'#CE93D8', emoji:'📱', label:'JazzCash' },
  easypaisa: { bg:'#0A3D1F', text:'#4CAF50', emoji:'💚', label:'Digital Bank' },
  meezan:    { bg:'#1B3A1F', text:'#66BB6A', emoji:'🏦', label:'Islamic Bank' },
  hbl:       { bg:'#4A0C0C', text:'#EF9A9A', emoji:'🏛️', label:'Commercial' },
  uba:       { bg:'#4A2800', text:'#FFCC80', emoji:'💳', label:'Digital' },
  other:     { bg:'#1A237E', text:'#90CAF9', emoji:'🏦', label:'Banking' },
};

const BG_THEMES = {
  navy: {
    css: 'linear-gradient(145deg, #0A1628 0%, #0D1F3C 50%, #0A1628 100%)',
    solid: '#0A1628',
    textMode: 'dark'
  },
  black: {
    css: 'linear-gradient(145deg, #050505 0%, #161616 55%, #050505 100%)',
    solid: '#050505',
    textMode: 'dark'
  },
  emerald: {
    css: 'linear-gradient(145deg, #06261D 0%, #0B3B2D 55%, #06261D 100%)',
    solid: '#06261D',
    textMode: 'dark'
  },
  maroon: {
    css: 'linear-gradient(145deg, #2A0710 0%, #4A1020 55%, #2A0710 100%)',
    solid: '#2A0710',
    textMode: 'dark'
  },
  white: {
    css: 'linear-gradient(145deg, #F9F7F0 0%, #FFFFFF 55%, #F1EBDD 100%)',
    solid: '#F9F7F0',
    textMode: 'light'
  }
};

let accounts = [
  {
    id: 1,
    bank: 'Raast',
    type: 'raast',
    name: 'Mir Aarib Traders',
    number: '03004493015',
    iban: '',
    branch: ''
  },
  {
    id: 2,
    bank: 'JazzCash',
    type: 'jazz',
    name: 'Muhammad Zakir Hussain',
    number: '03325275150',
    iban: 'PK10JCMA1510923325275150',
    branch: ''
  },
  {
    id: 3,
    bank: 'Meezan Bank',
    type: 'meezan',
    name: 'MUHAMMAD ZAKIR HUSSAIN',
    number: '98810103802374',
    iban: 'PK50MEZN0098810103802374',
    branch: 'QUAIDABAD BR SRG'
  }
];

let editingId = null;

function escapeHTML(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function getDownloadSettings() {
  const fontSize = Number(document.getElementById('fontSizeControl').value || 100);
  const letterSpacing = Number(document.getElementById('letterSpacingControl').value || 0);
  const bgKey = document.getElementById('downloadBgSelect').value;
  const custom = document.getElementById('customBgColor').value || '#0A1628';

  if (bgKey === 'custom') {
    return {
      fontSize,
      letterSpacing,
      bgCss: custom,
      bgSolid: custom,
      textMode: 'dark'
    };
  }

  const bg = BG_THEMES[bgKey] || BG_THEMES.navy;
  return {
    fontSize,
    letterSpacing,
    bgCss: bg.css,
    bgSolid: bg.solid,
    textMode: bg.textMode
  };
}

function applyDownloadSettings() {
  const s = getDownloadSettings();
  document.documentElement.style.setProperty('--download-bg', s.bgCss);
  document.documentElement.style.setProperty('--download-bg-solid', s.bgSolid);
  document.documentElement.style.setProperty('--dl-font-size', `${s.fontSize}%`);
  document.documentElement.style.setProperty('--dl-letter-spacing', `${s.letterSpacing}px`);

  document.getElementById('fontSizeLabel').textContent = `${s.fontSize}%`;
  document.getElementById('letterSpacingLabel').textContent = `${s.letterSpacing.toFixed(1)}px`;

  document.body.classList.toggle('download-light', s.textMode === 'light');

  const openPreviewModal = document.getElementById('previewModal').classList.contains('open');
  if (openPreviewModal) buildPreview();
}

function render() {
  const grid = document.getElementById('cardsGrid');
  if (!accounts.length) {
    grid.innerHTML = `<div class="empty">
      <svg width="60" height="60" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      <p>No accounts yet. Click <strong>Add Account</strong> to get started.</p>
    </div>`;
    return;
  }

  grid.innerHTML = accounts.map(a => {
    const theme = BANK_THEMES[a.type] || BANK_THEMES.other;
    return `
    <div class="account-card" id="card-${a.id}">
      <div class="card-bank-logo">
        <div class="bank-icon" style="background:${theme.bg}; color:${theme.text}">${theme.emoji}</div>
        <div>
          <div class="bank-name">${escapeHTML(a.bank)}</div>
          <div class="bank-type">${escapeHTML(theme.label)}</div>
        </div>
      </div>
      <div class="card-field">
        <div class="field-label">Account Holder</div>
        <div class="field-value large">${escapeHTML(a.name)}</div>
      </div>
      <div class="card-field">
        <div class="field-label">${a.type === 'raast' ? 'Raast ID' : 'Account / Mobile No.'}</div>
        <div class="field-value">${escapeHTML(a.number)}</div>
      </div>
      ${a.iban ? `<div class="card-field"><div class="field-label">IBAN</div><div class="field-value">${escapeHTML(a.iban)}</div></div>` : ''}
      ${a.branch ? `<div class="card-field"><div class="field-label">Branch</div><div class="field-value">${escapeHTML(a.branch)}</div></div>` : ''}
      <div class="card-actions">
        <button class="card-btn" onclick="editAccount(${a.id})">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Edit
        </button>
        <button class="card-btn danger" onclick="deleteAccount(${a.id})">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          Remove
        </button>
      </div>
    </div>`;
  }).join('');
}

function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Add New Account';
  ['f_bank','f_name','f_number','f_iban','f_branch'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f_type').value = 'other';
  document.getElementById('addModal').classList.add('open');
}

function editAccount(id) {
  editingId = id;
  const a = accounts.find(x => x.id === id);
  if (!a) return;

  document.getElementById('modalTitle').textContent = 'Edit Account';
  document.getElementById('f_bank').value = a.bank;
  document.getElementById('f_type').value = a.type;
  document.getElementById('f_name').value = a.name;
  document.getElementById('f_number').value = a.number;
  document.getElementById('f_iban').value = a.iban || '';
  document.getElementById('f_branch').value = a.branch || '';
  document.getElementById('addModal').classList.add('open');
}

function saveAccount() {
  const bank   = document.getElementById('f_bank').value.trim();
  const name   = document.getElementById('f_name').value.trim();
  const number = document.getElementById('f_number').value.trim();

  if (!bank || !name || !number) {
    alert('Please fill Bank Name, Account Holder, and Account Number.');
    return;
  }

  const data = {
    bank,
    name,
    number,
    type:   document.getElementById('f_type').value,
    iban:   document.getElementById('f_iban').value.trim(),
    branch: document.getElementById('f_branch').value.trim(),
  };

  if (editingId) {
    const idx = accounts.findIndex(x => x.id === editingId);
    if (idx > -1) accounts[idx] = { ...accounts[idx], ...data };
  } else {
    accounts.push({ id: Date.now(), ...data });
  }

  closeModal('addModal');
  render();

  if (document.getElementById('previewModal').classList.contains('open')) {
    buildPreview();
  }
}

function deleteAccount(id) {
  if (!confirm('Remove this account?')) return;
  accounts = accounts.filter(x => x.id !== id);
  render();

  if (document.getElementById('previewModal').classList.contains('open')) {
    buildPreview();
  }
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => {
    if (e.target === el) el.classList.remove('open');
  });
});

function buildDownloadHTML() {
  const now = new Date().toLocaleDateString('en-PK', { year:'numeric', month:'long', day:'numeric' });
  const rows = accounts.map(a => {
    const theme = BANK_THEMES[a.type] || BANK_THEMES.other;
    return `
    <div class="dl-account">
      <div class="dl-acc-header">
        <div class="dl-bank-icon" style="background:${theme.bg}; color:${theme.text}">${theme.emoji}</div>
        <div>
          <div class="dl-bank-name">${escapeHTML(a.bank)}</div>
          <div class="dl-bank-type">${escapeHTML(theme.label)}</div>
        </div>
      </div>
      <div class="dl-field"><div class="dl-field-label">Account Holder</div><div class="dl-field-value name">${escapeHTML(a.name)}</div></div>
      <div class="dl-field"><div class="dl-field-label">${a.type === 'raast' ? 'Raast ID' : 'Account / Mobile'}</div><div class="dl-field-value">${escapeHTML(a.number)}</div></div>
      ${a.iban ? `<div class="dl-field"><div class="dl-field-label">IBAN</div><div class="dl-field-value">${escapeHTML(a.iban)}</div></div>` : ''}
      ${a.branch ? `<div class="dl-field"><div class="dl-field-label">Branch</div><div class="dl-field-value">${escapeHTML(a.branch)}</div></div>` : ''}
    </div>`;
  }).join('');

  return `
  <div class="dl-card">
    <div class="dl-header">
      <div>
        <div class="dl-title">Payment Details</div>
        <div class="dl-subtitle">Bank Account Information</div>
      </div>
      <div class="dl-logo-mark">💳</div>
    </div>
    <div class="dl-accounts">${rows || `<div class="dl-account"><div class="dl-bank-name">No accounts added</div></div>`}</div>
    <div class="dl-footer">
      <div class="dl-footer-text">CONFIDENTIAL · FOR PAYMENT PURPOSES ONLY</div>
      <div class="dl-footer-date">${now}</div>
    </div>
  </div>`;
}

function buildPreview() {
  const wrap = document.getElementById('previewWrap');
  wrap.innerHTML = buildDownloadHTML();

  const s = getDownloadSettings();
  const card = wrap.querySelector('.dl-card');
  if (card) {
    card.style.background = s.bgCss;
  }

  if (s.textMode === 'light') {
    makeLightDownloadReadable(card);
  }
}

function openPreview() {
  applyDownloadSettings();
  buildPreview();
  document.getElementById('previewModal').classList.add('open');
}

function makeLightDownloadReadable(root) {
  if (!root) return;
  root.querySelectorAll('.dl-bank-name, .dl-field-value').forEach(el => el.style.color = '#172033');
  root.querySelectorAll('.dl-bank-type, .dl-subtitle').forEach(el => el.style.color = 'rgba(23,32,51,.55)');
  root.querySelectorAll('.dl-footer-text, .dl-footer-date').forEach(el => el.style.color = 'rgba(23,32,51,.45)');
  root.querySelectorAll('.dl-account').forEach(el => {
    el.style.background = 'rgba(0,0,0,.035)';
    el.style.borderColor = 'rgba(201,168,76,.35)';
  });
}

async function ensureFontsReady() {
  if (document.fonts && document.fonts.ready) {
    await document.fonts.ready;
  }
}

async function downloadImage() {
  applyDownloadSettings();

  if (typeof html2canvas === 'undefined') {
    alert('html2canvas is not loaded. Please check your internet connection or CDN access.');
    return;
  }

  const holder = document.getElementById('downloadCanvas');
  holder.innerHTML = buildDownloadHTML();

  const s = getDownloadSettings();
  const el = holder.querySelector('.dl-card');
  el.style.background = s.bgCss;

  if (s.textMode === 'light') {
    makeLightDownloadReadable(el);
  }

  await ensureFontsReady();
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  const renderedCanvas = await html2canvas(el, {
    scale: 2,
    useCORS: true,
    allowTaint: true,
    backgroundColor: null,
    logging: false
  });

  const link = document.createElement('a');
  link.download = 'bank-accounts.jpg';
  link.href = renderedCanvas.toDataURL('image/jpeg', 0.95);
  document.body.appendChild(link);
  link.click();
  link.remove();

  holder.innerHTML = '';
}

document.getElementById('fontSizeControl').addEventListener('input', applyDownloadSettings);
document.getElementById('letterSpacingControl').addEventListener('input', applyDownloadSettings);
document.getElementById('downloadBgSelect').addEventListener('change', applyDownloadSettings);
document.getElementById('customBgColor').addEventListener('input', () => {
  document.getElementById('downloadBgSelect').value = 'custom';
  applyDownloadSettings();
});

applyDownloadSettings();
render();
</script>
</body>
